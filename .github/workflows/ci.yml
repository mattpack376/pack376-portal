# Lint, type-check, unit tests, real-Postgres tests and a production build on
# every push and pull request. Uses a throwaway Postgres service container and
# placeholder secrets only — no production credentials exist in this job, and
# nothing here deploys or migrates the live database (Vercel does that for
# production deploys; see scripts/vercel-build.mjs).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Admin login on the service container, for the DB tests' own databases.
      TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/postgres
      # The database the build prerenders against (migrated below).
      DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/pack376_ci
      DATABASE_URL_UNPOOLED: postgresql://postgres:ci-only@127.0.0.1:5432/pack376_ci
      AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere-else
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - name: Create and migrate the build database
        run: |
          psql "$TEST_DATABASE_URL" -c 'CREATE DATABASE pack376_ci'
          npm run db:migrate:deploy
      - run: npm run build
